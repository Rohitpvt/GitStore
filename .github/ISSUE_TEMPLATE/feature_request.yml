name: Feature Request
description: Propose an idea or enhancement for GitStore
title: "[FEATURE]: <Short Description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve GitStore? Please describe it below.
        Keep in mind GitStore strictly operates under the two-platform constraint (GitHub & Firebase).

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or user pain point?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true
