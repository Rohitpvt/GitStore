name: Bug Report
description: Report an issue or broken link in GitStore
title: "[BUG]: <Short Description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with GitStore. Please provide the details below.

  - type: input
    id: url
    attributes:
      label: Affected Page URL or Product Slug
      placeholder: "e.g., https://rohitpvt.github.io/GitStore/product.html?slug=fast-terminal"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser Environment
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Mobile Browser
    validations:
      required: true
